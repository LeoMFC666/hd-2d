<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gen 3 Faithful 2.5D</title>
    <meta
      name="description"
      content="Pokémon da terceira geração em 2.5D no navegador, rodando o seu próprio ROM no mGBA."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="stage-area">
        <!-- O palco: cena 3D com a interface do GBA por cima, em 3:2 como a
             tela original, para as janelas do jogo cairem no lugar certo. -->
        <div id="stage" class="stage" data-mode="off">
          <div id="sceneContainer" aria-label="Mundo em 2.5D"></div>

          <canvas
            id="uiOverlay"
            class="ui-overlay"
            width="240"
            height="160"
            aria-hidden="true"
          ></canvas>

          <p class="stage-empty">
            Escolha o ROM de um jogo da terceira geração para começar.
          </p>

          <!-- Tela crua do GBA, em miniatura: referência e depuração. -->
          <figure id="pip" class="pip">
            <canvas id="emulator" aria-label="Tela original do GBA"></canvas>
          </figure>
        </div>
      </main>

      <footer class="toolbar">
        <span class="brand">Gen 3 Faithful 2.5D</span>

        <input id="romInput" type="file" accept=".gba,.gb,.gbc,.zip" hidden />
        <input id="saveInput" type="file" accept=".sav" hidden />

        <div class="controls">
          <button id="loadRom" type="button" class="primary">Abrir ROM</button>
          <button id="importSave" type="button">Importar save</button>
          <button id="exportSave" type="button">Exportar save</button>
          <button id="pauseToggle" type="button" data-state="running">Pausar</button>
          <button id="resetGame" type="button">Reiniciar</button>
          <button id="togglePip" type="button" aria-pressed="true">Esconder tela GBA</button>
        </div>

        <p id="status" class="status" role="status">Nenhum ROM aberto.</p>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
