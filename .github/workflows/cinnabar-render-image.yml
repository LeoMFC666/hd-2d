name: Cinnabar render image audit
on:
  push:
    branches: [diagnose/cinnabar-render-image]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: nohup npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 & sleep 2
      - name: Render and capture
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:900,height:700}});
          page.on('pageerror',e=>console.error('[pageerror]',e));
          await page.goto('http://127.0.0.1:5173/tests/cinnabar-render-image.html',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.body.dataset.pass==='true',{timeout:30000});
          console.log(await page.locator('#out').innerText());
          await page.locator('#map').screenshot({path:'/tmp/cinnabar.png'});
          await browser.close();
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cinnabar-render
          path: /tmp/cinnabar.png
