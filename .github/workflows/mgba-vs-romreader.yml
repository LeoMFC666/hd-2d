name: mGBA vs ROM reader audit
on:
  push:
    branches: [diagnose/mgba-vs-romreader]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          sleep 2
      - name: Browser audit
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=swiftshader']});
          const page=await browser.newPage({viewport:{width:900,height:600}});
          page.on('console',m=>console.log('[browser]',m.type(),m.text()));
          page.on('pageerror',e=>console.error('[pageerror]',e));
          await page.goto('http://127.0.0.1:5173/tests/mgba-vs-romreader.html',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.body.dataset.pass==='true',{timeout:120000});
          console.log(await page.locator('#out').innerText());
          await browser.close();
          EOF
