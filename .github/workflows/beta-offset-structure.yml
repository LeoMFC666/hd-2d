name: Beta offset structure audit
on:
  push:
    branches: [diagnose/beta-offset-structure]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save tsx
      - run: npx tsx scripts/beta-offset-structure.ts
