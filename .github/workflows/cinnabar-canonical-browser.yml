name: Cinnabar canonical browser regression
on:
  push:
    branches: [diagnose/cinnabar-canonical-anchor]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: nohup npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 & sleep 2
      - run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          const p=await b.newPage({viewport:{width:700,height:500}});
          await p.goto('http://127.0.0.1:5173/tests/cinnabar-canonical-browser.html',{waitUntil:'networkidle'});
          await p.waitForFunction(()=>document.body.dataset.pass==='true',{timeout:60000});
          console.log(await p.locator('#out').innerText());
          await p.locator('#map').screenshot({path:'/tmp/cinnabar-fixed.png'});
          await b.close();
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cinnabar-fixed-browser
          path: /tmp/cinnabar-fixed.png
